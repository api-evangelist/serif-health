  properties:
  - url: https://www.serifhealth.com/blog/announcing-our-live-payer-inventory-real-time-transparency-from-serif-health
    type: Documentation
  description: Live public inventory of 200+ payers with network-quality scoring,
    updated monthly, exposing data coverage and freshness across payer machine-readable
    files.
